<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Medicine Schedule</title>
<style>
  :root { --bg:#f6f7f9; --fg:#14181f; --muted:#667085; --accent:#2563eb; --card:#fff; --err:#dc2626; --ok:#16a34a; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#0f1319; --fg:#e8ecf2; --muted:#98a2b3; --accent:#3b82f6; --card:#1a2029; --err:#f87171; --ok:#4ade80; }
  }
  * { box-sizing: border-box; }
  [hidden] { display:none !important; }
  body { margin:0; min-height:100vh; display:grid; place-items:center; background:var(--bg); color:var(--fg);
         font-family:system-ui,-apple-system,sans-serif; padding:16px; }
  main { width:100%; max-width:360px; background:var(--card); border-radius:16px; padding:28px 24px; text-align:center;
         box-shadow:0 1px 3px rgba(0,0,0,.12); }
  h1 { font-size:1.25rem; margin:0 0 16px; }
  h2 { font-size:1.05rem; margin:0 0 16px; text-align:left; }
  p.sub { margin:0 0 24px; color:var(--muted); font-size:.9rem; }
  label, .label { display:block; text-align:left; font-size:.85rem; font-weight:600; margin:0 0 4px; }
  .hint { display:block; font-weight:400; color:var(--muted); }
  .optional { font-weight:400; color:var(--muted); }

  /* dispense button */
  .dispense { margin-bottom:20px; }
  .dispense-msg { margin-top:8px; font-size:.85rem; color:var(--muted); min-height:1.2em; }

  /* tabs */
  .tabs { display:flex; border-bottom:1px solid rgba(128,128,128,.3); margin:0 0 22px; }
  .tab { flex:1; padding:10px 0; font-size:.95rem; font-weight:600; border:0; border-bottom:3px solid transparent;
         background:none; color:var(--muted); cursor:pointer; }
  .tab[aria-selected=true] { color:var(--fg); border-bottom-color:var(--accent); }

  /* repeat-range slider + calendar */
  input[type=range] { width:100%; margin:0 0 6px; accent-color:var(--accent); }
  .range-out { font-weight:600; margin-bottom:16px; }
  .calendar { display:grid; grid-template-columns:repeat(7, 1fr); gap:4px; }
  .cal-head { font-size:.7rem; font-weight:600; color:var(--muted); padding-bottom:2px; }
  .cal-day { aspect-ratio:1; display:flex; flex-direction:column; align-items:center; justify-content:center;
             border-radius:8px; background:var(--bg); font-size:.85rem; line-height:1.1; }
  .cal-day small { font-size:.6rem; color:var(--muted); }
  .cal-day.today { outline:2px solid var(--accent); font-weight:700; }

  /* medicine form */
  .med { margin-top:28px; padding-top:22px; border-top:1px solid rgba(128,128,128,.3); }
  .med input[type=text], .med input[type=number], .med input[type=time], .med select {
    width:100%; padding:12px; margin-bottom:16px; font-size:1rem; border-radius:10px;
    border:1px solid var(--muted); background:var(--bg); color:var(--fg); }
  .days { display:grid; grid-template-columns:repeat(7, 1fr); gap:4px; margin-bottom:16px; }
  .day-btn { padding:10px 0; font-size:.75rem; font-weight:600; border:1px solid var(--muted); border-radius:8px;
             background:var(--bg); color:var(--fg); cursor:pointer; }
  .day-btn[aria-pressed=true] { background:var(--accent); border-color:var(--accent); color:#fff; }
  .primary { width:100%; padding:14px; font-size:1.05rem; font-weight:600; border:0; border-radius:12px;
             background:var(--accent); color:#fff; cursor:pointer; }
  .form-err, .form-ok { margin-top:10px; font-size:.85rem; min-height:1.2em; text-align:left; }
  .form-err { color:var(--err); }
  .form-ok { color:var(--ok); }
  .note { text-align:left; color:var(--muted); font-size:.85rem; margin:-8px 0 16px; }

  /* My Pills tab */
  .empty { color:var(--muted); font-size:.9rem; text-align:left; }
  .linklike { border:0; background:none; padding:0; color:var(--accent); font:inherit; text-decoration:underline; cursor:pointer; }
  #pillsList { display:grid; gap:8px; text-align:left; }
  details.pill { background:var(--bg); border-radius:10px; }
  details.pill summary { cursor:pointer; padding:12px; list-style:none; display:flex; justify-content:space-between;
                         align-items:baseline; gap:8px; }
  details.pill summary::-webkit-details-marker { display:none; }
  details.pill summary::after { content:"\25BE"; color:var(--muted); }
  details.pill[open] summary::after { content:"\25B4"; }
  .pill-name { font-weight:600; flex:1; overflow-wrap:anywhere; }
  .pill-left { color:var(--muted); font-size:.8rem; white-space:nowrap; }
  details.pill dl { margin:0; padding:0 12px 12px; display:grid; grid-template-columns:auto 1fr; gap:6px 12px; font-size:.85rem; }
  details.pill dt { color:var(--muted); }
  details.pill dd { margin:0; overflow-wrap:anywhere; }
</style>
</head>
<body>
<main>
  <h1>Medicine Schedule</h1>

  <div class="dispense">
    <button type="button" class="primary" id="dispenseBtn">Dispense</button>
    <div class="dispense-msg" id="dispenseMsg" role="status"></div>
  </div>

  <div class="tabs" role="tablist" aria-label="Sections">
    <button type="button" class="tab" id="tab-schedule" role="tab" aria-selected="true"
            aria-controls="panel-schedule" data-tab="schedule">Schedule</button>
    <button type="button" class="tab" id="tab-pills" role="tab" aria-selected="false"
            aria-controls="panel-pills" data-tab="pills" tabindex="-1">My Pills</button>
  </div>

  <!-- ============ Schedule tab ============ -->
  <div id="panel-schedule" role="tabpanel" aria-labelledby="tab-schedule">
    <p class="sub">Choose how many weeks the schedule repeats.</p>

    <label for="weeks">Repeat range
      <span class="hint">Slide to choose how many weeks</span></label>
    <input id="weeks" type="range" min="1" max="8" step="1" value="1">
    <div class="range-out"><output id="weeksOut" for="weeks">1 week</output></div>
    <div id="calendar" class="calendar" role="group" aria-label="Calendar for the chosen range"></div>

    <section class="med">
      <h2>Add a medicine</h2>
      <form id="medForm" novalidate>
        <label for="medName">Medicine name</label>
        <input id="medName" type="text" maxlength="60" autocomplete="off">

        <div class="label" id="daysLabel">How often do you take it?
          <span class="hint">Tap the days you take it</span></div>
        <div class="days" role="group" aria-labelledby="daysLabel">
          <button type="button" class="day-btn" data-day="0" aria-pressed="false">Sun</button>
          <button type="button" class="day-btn" data-day="1" aria-pressed="false">Mon</button>
          <button type="button" class="day-btn" data-day="2" aria-pressed="false">Tue</button>
          <button type="button" class="day-btn" data-day="3" aria-pressed="false">Wed</button>
          <button type="button" class="day-btn" data-day="4" aria-pressed="false">Thu</button>
          <button type="button" class="day-btn" data-day="5" aria-pressed="false">Fri</button>
          <button type="button" class="day-btn" data-day="6" aria-pressed="false">Sat</button>
        </div>

        <label for="medTimes">Times per day <span class="optional">(optional)</span>
          <span class="hint">1 to 10</span></label>
        <input id="medTimes" type="number" inputmode="numeric" min="1" max="10" step="1">

        <label for="timeMode">Time of day <span class="optional">(optional)</span></label>
        <select id="timeMode">
          <option value="">Not specified</option>
          <option value="set">Set a time</option>
          <option value="manual">Manual</option>
        </select>
        <div id="timeList"></div>
        <p id="manualNote" class="note" hidden>Manual: no set time. You decide when to take it.</p>

        <label for="medPills">How many pills do you have? <span class="optional">(optional)</span></label>
        <input id="medPills" type="number" inputmode="numeric" min="0" max="9999" step="1">

        <button type="submit" class="primary">Save medicine</button>
        <div class="form-err" id="medErr" role="alert"></div>
        <div class="form-ok" id="medOk" role="status"></div>
      </form>
    </section>
  </div>

  <!-- ============ My Pills tab ============ -->
  <div id="panel-pills" role="tabpanel" aria-labelledby="tab-pills" hidden>
    <h2>My Pills</h2>
    <p id="pillsEmpty" class="empty">No medicines yet. Add one on the
      <button type="button" class="linklike" id="goSchedule">Schedule</button> tab.</p>
    <div id="pillsList"></div>
  </div>
</main>

<script>
  const DAY_NAMES = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];

  // ---- Dispense button -----------------------------------------------------
  const dispenseBtn = document.getElementById("dispenseBtn");
  const dispenseMsg = document.getElementById("dispenseMsg");

  // PLACEHOLDER: this page is not connected to the device yet, so this only
  // shows a message. Put the real call here (for example a Firebase update).
  function dispense() {
    dispenseMsg.textContent = "Dispense requested. (Placeholder: not connected to the device yet.)";
  }
  dispenseBtn.addEventListener("click", dispense);

  // ---- Tabs ----------------------------------------------------------------
  const tabs = [...document.querySelectorAll(".tab")];

  function selectTab(name) {
    for (const tab of tabs) {
      const active = tab.dataset.tab === name;
      tab.setAttribute("aria-selected", String(active));
      tab.tabIndex = active ? 0 : -1;
      document.getElementById("panel-" + tab.dataset.tab).hidden = !active;
    }
  }

  for (const tab of tabs) {
    tab.addEventListener("click", () => selectTab(tab.dataset.tab));
    tab.addEventListener("keydown", event => {       // left/right arrows move between tabs
      if (event.key !== "ArrowRight" && event.key !== "ArrowLeft") return;
      const step = event.key === "ArrowRight" ? 1 : -1;
      const next = tabs[(tabs.indexOf(tab) + step + tabs.length) % tabs.length];
      selectTab(next.dataset.tab);
      next.focus();
    });
  }
  document.getElementById("goSchedule").addEventListener("click", () => selectTab("schedule"));

  // ---- Repeat-range slider + calendar -------------------------------------
  // The slider picks a number of weeks. The calendar shows that many rows of
  // seven days (Sunday to Saturday), starting with the current week.
  const weeksInput = document.getElementById("weeks");
  const weeksOut = document.getElementById("weeksOut");
  const calendarEl = document.getElementById("calendar");

  function renderCalendar() {
    const weeks = parseInt(weeksInput.value, 10);
    weeksOut.textContent = weeks + (weeks === 1 ? " week" : " weeks");

    calendarEl.replaceChildren();                    // clear the old calendar

    for (const name of DAY_NAMES) {                  // header row: Sun ... Sat
      const head = document.createElement("div");
      head.className = "cal-head";
      head.textContent = name;
      calendarEl.append(head);
    }

    const today = new Date();
    today.setHours(0, 0, 0, 0);
    const start = new Date(today);
    start.setDate(today.getDate() - today.getDay()); // back up to this week's Sunday

    for (let i = 0; i < weeks * 7; i++) {            // 7 days per week
      const day = new Date(start);
      day.setDate(start.getDate() + i);

      const cell = document.createElement("div");
      cell.className = "cal-day";
      cell.title = day.toLocaleDateString(undefined, { weekday: "long", month: "long", day: "numeric" });
      if (day.getTime() === today.getTime()) cell.classList.add("today");

      if (i === 0 || day.getDate() === 1) {          // label the month on the first cell and on the 1st
        const month = document.createElement("small");
        month.textContent = day.toLocaleDateString(undefined, { month: "short" });
        cell.append(month);
      }
      cell.append(String(day.getDate()));
      calendarEl.append(cell);
    }
  }

  weeksInput.addEventListener("input", renderCalendar);
  renderCalendar();

  // ---- Medicine form -------------------------------------------------------
  const form = document.getElementById("medForm");
  const nameInput = document.getElementById("medName");
  const dayButtons = [...document.querySelectorAll(".day-btn")];
  const timesInput = document.getElementById("medTimes");
  const timeMode = document.getElementById("timeMode");
  const timeList = document.getElementById("timeList");
  const manualNote = document.getElementById("manualNote");
  const pillsInput = document.getElementById("medPills");
  const medErr = document.getElementById("medErr");
  const medOk = document.getElementById("medOk");

  const medicines = [];     // saved in memory only; cleared when the page reloads

  // Tapping a day toggles it on or off.
  for (const btn of dayButtons) {
    btn.addEventListener("click", () => {
      const on = btn.getAttribute("aria-pressed") === "true";
      btn.setAttribute("aria-pressed", String(!on));
    });
  }

  // How many dose times to ask for: the "times per day" value, or 1 if it is empty/invalid.
  function doseCount() {
    const n = parseInt(timesInput.value, 10);
    return Number.isInteger(n) && n >= 1 ? Math.min(n, 10) : 1;
  }

  // Shows one time box per dose when "Set a time" is chosen; keeps anything already typed.
  function renderTimeInputs() {
    const previous = [...timeList.querySelectorAll("input")].map(i => i.value);
    timeList.replaceChildren();
    manualNote.hidden = timeMode.value !== "manual";
    if (timeMode.value !== "set") return;

    const count = doseCount();
    for (let i = 0; i < count; i++) {
      const box = document.createElement("input");
      box.type = "time";
      box.value = previous[i] || "";
      box.setAttribute("aria-label", count === 1 ? "Time to take it" : "Dose " + (i + 1) + " time");
      timeList.append(box);
    }
  }

  timesInput.addEventListener("input", renderTimeInputs);
  timeMode.addEventListener("change", renderTimeInputs);

  function fail(message, field) {
    medErr.textContent = message;
    if (field) field.focus();
  }

  form.addEventListener("submit", event => {
    event.preventDefault();
    medErr.textContent = "";
    medOk.textContent = "";

    const name = nameInput.value.trim();
    if (!name) return fail("Enter the medicine name.", nameInput);

    const days = dayButtons.filter(b => b.getAttribute("aria-pressed") === "true").map(b => Number(b.dataset.day));
    if (days.length === 0) return fail("Tap at least one day.", dayButtons[0]);

    let perDay = null;                               // optional: times per day
    if (timesInput.value !== "") {
      const n = Number(timesInput.value);
      if (!Number.isInteger(n) || n < 1 || n > 10) return fail("Times per day must be a whole number from 1 to 10.", timesInput);
      perDay = n;
    }

    let times = [];                                  // optional: specific times
    if (timeMode.value === "set") {
      times = [...timeList.querySelectorAll("input")].map(i => i.value);
      const empty = [...timeList.querySelectorAll("input")].find(i => !i.value);
      if (empty) return fail("Fill in every time, or choose Manual.", empty);
    }

    let pills = null;                                // optional: pills on hand
    if (pillsInput.value !== "") {
      const n = Number(pillsInput.value);
      if (!Number.isInteger(n) || n < 0 || n > 9999) return fail("Pill count must be a whole number from 0 to 9999.", pillsInput);
      pills = n;
    }

    medicines.push({ name, days, perDay, timeMode: timeMode.value, times, pills });
    renderPills();
    medOk.textContent = "Saved " + name + ". See it under My Pills.";

    form.reset();                                    // clear the text/number/select fields
    for (const btn of dayButtons) btn.setAttribute("aria-pressed", "false");
    renderTimeInputs();
    nameInput.focus();
  });

  // ---- My Pills tab --------------------------------------------------------
  const pillsList = document.getElementById("pillsList");
  const pillsEmpty = document.getElementById("pillsEmpty");

  // Adds one "label: value" row to a summary.
  function addRow(dl, label, value) {
    const dt = document.createElement("dt");
    dt.textContent = label;
    const dd = document.createElement("dd");
    dd.textContent = value;
    dl.append(dt, dd);
  }

  // One collapsible entry per medicine: the header shows the name and pills left,
  // and clicking it opens the full summary.
  function renderPills() {
    pillsList.replaceChildren();
    pillsEmpty.hidden = medicines.length > 0;

    for (const m of medicines) {
      const details = document.createElement("details");
      details.className = "pill";

      const summary = document.createElement("summary");
      const nameEl = document.createElement("span");
      nameEl.className = "pill-name";
      nameEl.textContent = m.name;
      const leftEl = document.createElement("span");
      leftEl.className = "pill-left";
      leftEl.textContent = m.pills === null ? "" : m.pills + " left";
      summary.append(nameEl, leftEl);

      const dl = document.createElement("dl");
      addRow(dl, "Name", m.name);
      addRow(dl, "Pills left", m.pills === null ? "Not entered" : String(m.pills));
      addRow(dl, "Days", m.days.length === 7 ? "Every day" : m.days.map(d => DAY_NAMES[d]).join(", "));
      addRow(dl, "Times per day", m.perDay === null ? "Not specified" : String(m.perDay));
      addRow(dl, "Time of day",
             m.timeMode === "set" ? m.times.join(", ")
             : m.timeMode === "manual" ? "Manual"
             : "Not specified");

      details.append(summary, dl);
      pillsList.append(details);
    }
  }
</script>
</body>
</html>
