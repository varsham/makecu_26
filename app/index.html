<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Servo Control</title>
<style>
  :root { --bg:#f6f7f9; --fg:#14181f; --muted:#667085; --accent:#2563eb; --card:#fff; --ok:#16a34a; --warn:#d97706; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#0f1319; --fg:#e8ecf2; --muted:#98a2b3; --accent:#3b82f6; --card:#1a2029; --ok:#4ade80; --warn:#fbbf24; }
  }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; display:grid; place-items:center; background:var(--bg); color:var(--fg);
         font-family:system-ui,-apple-system,sans-serif; padding:16px; }
  main { width:100%; max-width:360px; background:var(--card); border-radius:16px; padding:28px 24px; text-align:center;
         box-shadow:0 1px 3px rgba(0,0,0,.12); }
  h1 { font-size:1.25rem; margin:0 0 4px; }
  p.sub { margin:0 0 24px; color:var(--muted); font-size:.9rem; }
  button { width:100%; padding:18px; font-size:1.1rem; font-weight:600; border:0; border-radius:12px;
           background:var(--accent); color:#fff; cursor:pointer; }
  button:disabled { opacity:.5; cursor:not-allowed; }
  .status { margin-top:20px; font-size:.95rem; color:var(--muted); }
  .status b { color:var(--fg); }
  .dot { display:inline-block; width:10px; height:10px; border-radius:50%; margin-right:6px; background:var(--muted); }
  .dot.ready { background:var(--ok); } .dot.moving { background:var(--warn); }
  .err { color:#dc2626; margin-top:12px; font-size:.85rem; min-height:1em; }
</style>
</head>
<body>
<main>
  <h1>Servo Control</h1>
  <p class="sub">Tap the button to move the servo.</p>
  <button id="go">Move servo</button>
  <div class="status"><span id="dot" class="dot"></span>Device: <b id="state">connecting…</b></div>
  <div class="err" id="err"></div>
</main>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getDatabase, ref, set, onValue } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

  // Paste your Firebase web app config here (Project settings -> Your apps -> Config).
  const firebaseConfig = {
    apiKey: "YOUR_API_KEY",
    authDomain: "YOUR-PROJECT.firebaseapp.com",
    databaseURL: "https://YOUR-PROJECT-default-rtdb.firebaseio.com",
    projectId: "YOUR-PROJECT",
    appId: "YOUR_APP_ID"
  };

  const db = getDatabase(initializeApp(firebaseConfig));
  const btn = document.getElementById("go");
  const stateEl = document.getElementById("state");
  const dot = document.getElementById("dot");
  const errEl = document.getElementById("err");

  onValue(ref(db, "device/status"), snap => {
    const s = snap.val() ?? "no device yet";
    stateEl.textContent = s;
    dot.className = "dot " + (s === "ready" || s === "moving" ? s : "");
  }, e => { errEl.textContent = "Database error: " + e.message; });

  btn.addEventListener("click", async () => {
    errEl.textContent = "";
    btn.disabled = true;
    try {
      await set(ref(db, "device/trigger"), Date.now());   // a new value = "move now"
    } catch (e) {
      errEl.textContent = "Couldn't send: " + e.message;
    }
    setTimeout(() => { btn.disabled = false; }, 1800);     // avoid double taps mid-move
  });
</script>
</body>
</html>
