<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Motor Control</title>
<style>
  :root { --bg:#f6f7f9; --fg:#14181f; --muted:#667085; --accent:#2563eb; --card:#fff; --ok:#16a34a; --warn:#d97706; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#0f1319; --fg:#e8ecf2; --muted:#98a2b3; --accent:#3b82f6; --card:#1a2029; --ok:#4ade80; --warn:#fbbf24; }
  }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; display:grid; place-items:center; background:var(--bg); color:var(--fg);
         font-family:system-ui,-apple-system,sans-serif; padding:16px; }
  main { width:100%; max-width:360px; background:var(--card); border-radius:16px; padding:28px 24px; text-align:center;
         box-shadow:0 1px 3px rgba(0,0,0,.12); }
  h1 { font-size:1.25rem; margin:0 0 4px; }
  p.sub { margin:0 0 24px; color:var(--muted); font-size:.9rem; }
  button { width:100%; padding:18px; font-size:1.1rem; font-weight:600; border:0; border-radius:12px;
           background:var(--accent); color:#fff; cursor:pointer; }
  button:disabled { opacity:.5; cursor:not-allowed; }
  label { display:block; text-align:left; font-size:.85rem; font-weight:600; margin:0 0 4px; }
  .hint { display:block; font-weight:400; color:var(--muted); }
  input { width:100%; padding:12px; margin-bottom:16px; font-size:1.05rem; border-radius:10px;
          border:1px solid var(--muted); background:var(--bg); color:var(--fg); }
  .status { margin-top:20px; font-size:.95rem; color:var(--muted); }
  .status b { color:var(--fg); }
  .dot { display:inline-block; width:10px; height:10px; border-radius:50%; margin-right:6px; background:var(--muted); }
  .dot.ready { background:var(--ok); } .dot.moving { background:var(--warn); }
  .err { color:#dc2626; margin-top:12px; font-size:.85rem; min-height:1em; }
</style>
</head>
<body>
<main>
  <h1>Motor Control</h1>
  <p class="sub">Choose a position and an angle, then tap the button.</p>
  <label for="stepper">Stepper position
    <span class="hint">Even number, 0 to 1022 (1024 = one full turn)</span></label>
  <input id="stepper" type="number" inputmode="numeric" min="0" max="1022" step="2" value="0">
  <label for="servo">Servo angle
    <span class="hint">Degrees, 0 to 180</span></label>
  <input id="servo" type="number" inputmode="numeric" min="0" max="180" step="1" value="90">
  <button id="go">Move motors</button>
  <div class="status"><span id="dot" class="dot"></span>Device: <b id="state">connecting…</b></div>
  <div class="err" id="err"></div>
</main>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getDatabase, ref, update, onValue } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

  // Paste your Firebase web app config here (Project settings -> Your apps -> Config).
  const firebaseConfig = {
  apiKey: "AIzaSyClWxrZhWwi6HuDQigRB6FgwVQjUh79Nak",
  authDomain: "sprout-makecu26.firebaseapp.com",
  databaseURL: "https://sprout-makecu26-default-rtdb.firebaseio.com",
  projectId: "sprout-makecu26",
  storageBucket: "sprout-makecu26.firebasestorage.app",
  messagingSenderId: "94592405023",
  appId: "1:94592405023:web:e01ada846de8771d738f2a"
};

  const db = getDatabase(initializeApp(firebaseConfig));
  const btn = document.getElementById("go");
  const stepperInput = document.getElementById("stepper");
  const servoInput = document.getElementById("servo");
  const stateEl = document.getElementById("state");
  const dot = document.getElementById("dot");
  const errEl = document.getElementById("err");

  let deviceMoving = false;     // true while the device reports "moving"
  let justSent = false;         // brief lock after a tap, before the device answers
  const refreshButton = () => { btn.disabled = deviceMoving || justSent; };

  onValue(ref(db, "device/status"), snap => {
    const s = snap.val() ?? "no device yet";
    stateEl.textContent = s;
    dot.className = "dot " + (s === "ready" || s === "moving" ? s : "");
    deviceMoving = (s === "moving");
    refreshButton();
  }, e => { errEl.textContent = "Database error: " + e.message; });

  btn.addEventListener("click", async () => {
    errEl.textContent = "";

    let stepper = parseInt(stepperInput.value, 10);
    const angle = parseInt(servoInput.value, 10);
    if (Number.isNaN(stepper) || Number.isNaN(angle)) {
      errEl.textContent = "Enter a whole number in both boxes.";
      return;
    }
    if (stepper < 0 || stepper > 1022) {
      errEl.textContent = "Stepper position must be between 0 and 1022.";
      return;
    }
    if (angle < 0 || angle > 180) {
      errEl.textContent = "Servo angle must be between 0 and 180.";
      return;
    }
    stepper -= stepper % 2;                 // the stepper only reaches even positions
    stepperInput.value = stepper;

    justSent = true;
    refreshButton();
    try {
      // One update writes all three values together, so the device never sees
      // a new trigger with old targets.
      await update(ref(db, "device"), {
        stepperTarget: stepper,
        servoAngle: angle,
        trigger: Date.now()                  // a new value = "move now"
      });
    } catch (e) {
      errEl.textContent = "Couldn't send: " + e.message;
    }
    setTimeout(() => { justSent = false; refreshButton(); }, 1800);   // avoid double taps
  });
</script>
</body>
</html>
