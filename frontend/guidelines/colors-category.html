<!-- @dsCard group="Colors" viewport="700x150" name="Pill categories" subtitle="Tile colours for grouping pills" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:20px;background:var(--bg-app);font-family:var(--font-body);color:var(--text-body)}.row{display:flex;gap:12px;flex-wrap:wrap}.sw{display:flex;flex-direction:column;gap:6px;font-size:12px}.chip{width:84px;height:64px;border-radius:var(--radius-md)}.n{font-weight:600;color:var(--text-strong)}.m{font-family:var(--font-mono);font-size:11px;color:var(--text-muted)}</style></head><body><div class="row"><div class="sw"><div class="chip" style="background:var(--cat-daily)"></div><span class="n">Daily</span><span class="m">--cat-daily<br>leaf-200</span></div><div class="sw"><div class="chip" style="background:var(--cat-vitamin)"></div><span class="n">Vitamins</span><span class="m">--cat-vitamin<br>honey</span></div><div class="sw"><div class="chip" style="background:var(--cat-heart)"></div><span class="n">Heart</span><span class="m">--cat-heart<br>rose-200</span></div><div class="sw"><div class="chip" style="background:var(--cat-pain)"></div><span class="n">Pain relief</span><span class="m">--cat-pain<br>apricot-200</span></div><div class="sw"><div class="chip" style="background:var(--cat-sleep)"></div><span class="n">Sleep</span><span class="m">--cat-sleep<br>sky-200</span></div><div class="sw"><div class="chip" style="background:var(--cat-other)"></div><span class="n">Other</span><span class="m">--cat-other<br>mauve</span></div></div></body></html>
