<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:20px;background:var(--bg-app);font-family:var(--font-body);color:var(--text-body)}.row{display:flex;gap:12px;flex-wrap:wrap}.sw{display:flex;flex-direction:column;gap:6px;font-size:12px}.chip{width:84px;height:64px;border-radius:var(--radius-md)}.n{font-weight:600;color:var(--text-strong)}.m{font-family:var(--font-mono);font-size:11px;color:var(--text-muted)}</style></head><body><style>@keyframes pop{0%,20%{transform:scale(.6);opacity:0}50%{transform:scale(1.08);opacity:1}70%,100%{transform:scale(1)}}</style><div class="row" style="gap:28px;align-items:center"><div style="width:56px;height:56px;border-radius:50%;background:var(--leaf-200);animation:pop 2s var(--ease-sprout) infinite"></div><div><div class="n">--ease-sprout</div><div class="m">cubic-bezier(.34,1.4,.64,1) · confirmations, dispensed</div></div><div><div class="n">--ease-soft</div><div class="m">cubic-bezier(.3,.7,.4,1) · sheets, fades</div></div></div></body></html>
