<!-- @dsCard group="Colors" viewport="700x150" name="Paper & tiles" subtitle="Calendar-inspired warm surfaces" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:20px;background:var(--bg-app);font-family:var(--font-body);color:var(--text-body)}.row{display:flex;gap:12px;flex-wrap:wrap}.sw{display:flex;flex-direction:column;gap:6px;font-size:12px}.chip{width:84px;height:64px;border-radius:var(--radius-md)}.n{font-weight:600;color:var(--text-strong)}.m{font-family:var(--font-mono);font-size:11px;color:var(--text-muted)}</style></head><body><div class="row"><div class="sw"><div class="chip" style="background:var(--paper);box-shadow:inset 0 0 0 1px var(--border-soft)"></div><span class="n">Paper</span><span class="m">--paper<br>#F4F2EE</span></div><div class="sw"><div class="chip" style="background:var(--cream)"></div><span class="n">Cream</span><span class="m">--cream<br>#EBE6DD</span></div><div class="sw"><div class="chip" style="background:var(--oat)"></div><span class="n">Oat</span><span class="m">--oat<br>#E6DDD3</span></div><div class="sw"><div class="chip" style="background:var(--sand)"></div><span class="n">Sand</span><span class="m">--sand<br>#D8CBB8</span></div><div class="sw"><div class="chip" style="background:var(--tan)"></div><span class="n">Tan</span><span class="m">--tan<br>#C1A48B</span></div><div class="sw"><div class="chip" style="background:var(--honey)"></div><span class="n">Honey</span><span class="m">--honey<br>#EAC98C</span></div><div class="sw"><div class="chip" style="background:var(--mauve)"></div><span class="n">Mauve</span><span class="m">--mauve<br>#ADA2A2</span></div></div></body></html>
