<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:20px;background:var(--bg-app);font-family:var(--font-body);color:var(--text-body)}.row{display:flex;gap:12px;flex-wrap:wrap}.sw{display:flex;flex-direction:column;gap:6px;font-size:12px}.chip{width:84px;height:64px;border-radius:var(--radius-md)}.n{font-weight:600;color:var(--text-strong)}.m{font-family:var(--font-mono);font-size:11px;color:var(--text-muted)}</style></head><body><div class="row"><div class="sw"><div class="chip" style="background:var(--white);box-shadow:inset 0 0 0 1px var(--border-soft)"></div><span class="n">White</span><span class="m">--white<br>#FFFDF9</span></div><div class="sw"><div class="chip" style="background:var(--ink-100)"></div><span class="n">Ink 100</span><span class="m">--ink-100<br>#E2DDD6</span></div><div class="sw"><div class="chip" style="background:var(--ink-300)"></div><span class="n">Ink 300</span><span class="m">--ink-300<br>#B5ADA5</span></div><div class="sw"><div class="chip" style="background:var(--ink-500)"></div><span class="n">Ink 500</span><span class="m">--ink-500<br>#7A716A</span></div><div class="sw"><div class="chip" style="background:var(--ink-700)"></div><span class="n">Ink 700</span><span class="m">--ink-700<br>#4A443F</span></div><div class="sw"><div class="chip" style="background:var(--ink-900)"></div><span class="n">Ink 900</span><span class="m">--ink-900<br>#2B2724</span></div></div></body></html>
