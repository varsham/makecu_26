<!-- @dsCard group="Colors" viewport="700x150" name="Stock levels" subtitle="Plenty · running low · almost out" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:20px;background:var(--bg-app);font-family:var(--font-body);color:var(--text-body)}.row{display:flex;gap:12px;flex-wrap:wrap}.sw{display:flex;flex-direction:column;gap:6px;font-size:12px}.chip{width:84px;height:64px;border-radius:var(--radius-md)}.n{font-weight:600;color:var(--text-strong)}.m{font-family:var(--font-mono);font-size:11px;color:var(--text-muted)}</style></head><body><div class="row" style="gap:16px"><div style="flex:1;min-width:180px;background:var(--stock-ok-soft);border-radius:var(--radius-md);padding:14px"><div style="display:flex;justify-content:space-between;font-weight:600;color:var(--text-strong)"><span>Plenty</span><span style="color:var(--stock-ok)">24 left</span></div><div style="height:8px;border-radius:99px;background:rgba(255,255,255,.7);margin-top:10px"><div style="height:100%;width:80%;border-radius:99px;background:var(--stock-ok)"></div></div><div class="m" style="margin-top:8px">--stock-ok</div></div><div style="flex:1;min-width:180px;background:var(--stock-low-soft);border-radius:var(--radius-md);padding:14px"><div style="display:flex;justify-content:space-between;font-weight:600;color:var(--text-strong)"><span>Running low</span><span style="color:var(--stock-low)">6 left</span></div><div style="height:8px;border-radius:99px;background:rgba(255,255,255,.7);margin-top:10px"><div style="height:100%;width:30%;border-radius:99px;background:var(--stock-low)"></div></div><div class="m" style="margin-top:8px">--stock-low</div></div><div style="flex:1;min-width:180px;background:var(--stock-out-soft);border-radius:var(--radius-md);padding:14px"><div style="display:flex;justify-content:space-between;font-weight:600;color:var(--text-strong)"><span>Almost out</span><span style="color:var(--stock-out)">2 left</span></div><div style="height:8px;border-radius:99px;background:rgba(255,255,255,.7);margin-top:10px"><div style="height:100%;width:10%;border-radius:99px;background:var(--stock-out)"></div></div><div class="m" style="margin-top:8px">--stock-out</div></div></div></body></html>
