<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:20px;background:var(--bg-app);font-family:var(--font-body);color:var(--text-body)}.row{display:flex;gap:12px;flex-wrap:wrap}.sw{display:flex;flex-direction:column;gap:6px;font-size:12px}.chip{width:84px;height:64px;border-radius:var(--radius-md)}.n{font-weight:600;color:var(--text-strong)}.m{font-family:var(--font-mono);font-size:11px;color:var(--text-muted)}</style></head><body><div class="row" style="gap:16px"><div class="sw" style="align-items:center"><div style="width:72px;height:56px;background:var(--oat);border-radius:var(--radius-xs)"></div><span class="m">xs</span></div><div class="sw" style="align-items:center"><div style="width:72px;height:56px;background:var(--oat);border-radius:var(--radius-sm)"></div><span class="m">sm</span></div><div class="sw" style="align-items:center"><div style="width:72px;height:56px;background:var(--oat);border-radius:var(--radius-md)"></div><span class="m">md</span></div><div class="sw" style="align-items:center"><div style="width:72px;height:56px;background:var(--oat);border-radius:var(--radius-lg)"></div><span class="m">lg</span></div><div class="sw" style="align-items:center"><div style="width:72px;height:56px;background:var(--oat);border-radius:var(--radius-xl)"></div><span class="m">xl</span></div><div class="sw" style="align-items:center"><div style="width:72px;height:56px;background:var(--oat);border-radius:var(--radius-pill)"></div><span class="m">pill</span></div></div></body></html>
