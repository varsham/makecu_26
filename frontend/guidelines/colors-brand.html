<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:20px;background:var(--bg-app);font-family:var(--font-body);color:var(--text-body)}.row{display:flex;gap:12px;flex-wrap:wrap}.sw{display:flex;flex-direction:column;gap:6px;font-size:12px}.chip{width:84px;height:64px;border-radius:var(--radius-md)}.n{font-weight:600;color:var(--text-strong)}.m{font-family:var(--font-mono);font-size:11px;color:var(--text-muted)}</style></head><body><div class="row" style="gap:20px"><div class="sw"><div style="display:flex"><div class="chip" style="background:var(--leaf-200);border-radius:var(--radius-md) 0 0 var(--radius-md)"></div><div class="chip" style="background:var(--leaf-600);border-radius:0 var(--radius-md) var(--radius-md) 0"></div></div><span class="n">Leaf</span><span class="m">#CBD960 / #617028</span></div><div class="sw"><div style="display:flex"><div class="chip" style="background:var(--rose-200);border-radius:var(--radius-md) 0 0 var(--radius-md)"></div><div class="chip" style="background:var(--rose-500);border-radius:0 var(--radius-md) var(--radius-md) 0"></div></div><span class="n">Rose</span><span class="m">#F7A9B9 / #CE6377</span></div><div class="sw"><div style="display:flex"><div class="chip" style="background:var(--sky-200);border-radius:var(--radius-md) 0 0 var(--radius-md)"></div><div class="chip" style="background:var(--sky-600);border-radius:0 var(--radius-md) var(--radius-md) 0"></div></div><span class="n">Sky</span><span class="m">#BFE5F0 / #0874A0</span></div><div class="sw"><div style="display:flex"><div class="chip" style="background:var(--apricot-200);border-radius:var(--radius-md) 0 0 var(--radius-md)"></div><div class="chip" style="background:var(--apricot-600);border-radius:0 var(--radius-md) var(--radius-md) 0"></div></div><span class="n">Apricot</span><span class="m">#FCAD6A / #F76D0B</span></div></div></body></html>
