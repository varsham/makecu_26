<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:20px;background:var(--bg-app);font-family:var(--font-body);color:var(--text-body)}.row{display:flex;gap:12px;flex-wrap:wrap}.sw{display:flex;flex-direction:column;gap:6px;font-size:12px}.chip{width:84px;height:64px;border-radius:var(--radius-md)}.n{font-weight:600;color:var(--text-strong)}.m{font-family:var(--font-mono);font-size:11px;color:var(--text-muted)}</style></head><body><div style="display:grid;grid-template-columns:repeat(7,1fr);gap:8px"><div style="aspect-ratio:.8;background:var(--oat);border-radius:var(--radius-sm);padding:6px 8px;font-family:var(--font-display);font-weight:500;color:var(--ink-900)">3</div><div style="aspect-ratio:.8;background:var(--tan);border-radius:var(--radius-sm);padding:6px 8px;font-family:var(--font-display);font-weight:500;color:var(--ink-900)">4</div><div style="aspect-ratio:.8;background:var(--oat);border-radius:var(--radius-sm);padding:6px 8px;font-family:var(--font-display);font-weight:500;color:var(--ink-900)">5</div><div style="aspect-ratio:.8;background:var(--honey);border-radius:var(--radius-sm);padding:6px 8px;font-family:var(--font-display);font-weight:500;color:var(--ink-900)">6</div><div style="aspect-ratio:.8;background:var(--mauve);border-radius:var(--radius-sm);padding:6px 8px;font-family:var(--font-display);font-weight:500;color:var(--ink-900)">7</div><div style="aspect-ratio:.8;background:var(--oat);border-radius:var(--radius-sm);padding:6px 8px;font-family:var(--font-display);font-weight:500;color:var(--ink-900)">8</div><div style="aspect-ratio:.8;background:var(--honey);border-radius:var(--radius-sm);padding:6px 8px;font-family:var(--font-display);font-weight:500;color:var(--ink-900)">9</div></div></body></html>
