<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:20px;background:var(--bg-app);font-family:var(--font-body);color:var(--text-body)}.row{display:flex;gap:12px;flex-wrap:wrap}.sw{display:flex;flex-direction:column;gap:6px;font-size:12px}.chip{width:84px;height:64px;border-radius:var(--radius-md)}.n{font-weight:600;color:var(--text-strong)}.m{font-family:var(--font-mono);font-size:11px;color:var(--text-muted)}</style></head><body><div class="row"><div class="sw"><div class="chip" style="background:var(--leaf-50);box-shadow:inset 0 0 0 1px var(--border-soft)"></div><span class="n">Leaf 50</span><span class="m">--leaf-50<br>#F2F5DA</span></div><div class="sw"><div class="chip" style="background:var(--leaf-200)"></div><span class="n">Leaf 200</span><span class="m">--leaf-200<br>#CBD960</span></div><div class="sw"><div class="chip" style="background:var(--leaf-400)"></div><span class="n">Leaf 400</span><span class="m">--leaf-400<br>#93A146</span></div><div class="sw"><div class="chip" style="background:var(--leaf-600)"></div><span class="n">Leaf 600</span><span class="m">--leaf-600<br>#617028</span></div><div class="sw"><div class="chip" style="background:var(--leaf-800)"></div><span class="n">Leaf 800</span><span class="m">--leaf-800<br>#3F4A18</span></div></div></body></html>
